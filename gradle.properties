# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ========== atlas face-sdk 仓库自动同步 ==========
# 启用后：sync 时若本地无该仓库则 git clone，已有则 git pull（offline 模式自动跳过）
atlasMavenEnabled=true
# 仓库地址（GitLab）
atlasMavenRepoUrl=ssh://git@10.14.101.201:9005/algo/atlas_maven.git
# 本地 checkout 目录：默认 ~/.m2/repository/atlas_maven（maven 本地仓库内，
# clone 后根目录即标准 maven 布局 atlas/sdk/face/...，与坐标 atlas.sdk.face 匹配）
# atlasMavenLocalDir=/path/to/atlas_maven
